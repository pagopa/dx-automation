name: Release Bootstrapper Infrastructure - uat
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@abb37e552370c4b3e2e5b2601c76a307f421c074 # main
    name: Release Bootstrapper (uat)
    secrets: inherit
    with:
      environment: 'uat'
