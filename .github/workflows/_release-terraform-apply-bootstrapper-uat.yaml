name: Release Bootstrapper Infrastructure - uat
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@723b8233cd9c48bac7cc9e796471d4e12d4f8e5c # main
    name: Release Bootstrapper (uat)
    secrets: inherit
    with:
      environment: 'uat'
