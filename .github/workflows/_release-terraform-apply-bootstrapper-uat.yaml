name: Release Bootstrapper Infrastructure - uat
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@625f02f382c33eb449cd94facb8e426bf7ae37ea # main
    name: Release Bootstrapper (uat)
    secrets: inherit
    with:
      environment: 'uat'
