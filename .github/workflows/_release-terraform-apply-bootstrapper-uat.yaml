name: Release Bootstrapper Infrastructure - uat
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@dea3cc35e4d6a26cc8aa3b08ab22d48c0f958f77 # main
    name: Release Bootstrapper (uat)
    secrets: inherit
    with:
      environment: 'uat'
